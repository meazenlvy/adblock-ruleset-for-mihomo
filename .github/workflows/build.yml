name: Build Mihomo Ruleset

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"


permissions:
  contents: write


concurrency:
  group: build-ruleset
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Cache mihomo
        uses: actions/cache@v5
        with:
          path: bin/mihomo
          key: mihomo-v1.19.30-linux-amd64

      - name: Download mihomo (if not cached)
        run: |
          if [ ! -f bin/mihomo ]; then
            mkdir -p bin
            wget -O bin/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1-go123-v1.19.30.gz
            gzip -d bin/mihomo.gz
            chmod +x bin/mihomo
          fi


      - name: Fetch rules
        run: |
          python scripts/fetch.py



      - name: Decompile rules
        run: |
          python scripts/decompile.py

      - name: Parse rules
        run: |
          python scripts/parse.py


      - name: Merge rules
        run: |
          python scripts/merge.py


      - name: Build mrs
        run: |
          python scripts/compile.py


      - name: Commit changes
        run: |

          git config user.name \
          "github-actions[bot]"
          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          git add rules/
          git add sources/
          git add process/


          git diff --cached --quiet || {
            git commit -m "Update mihomo ruleset"
            git push
          }
