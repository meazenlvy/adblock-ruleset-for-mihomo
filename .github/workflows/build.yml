name: Build Mihomo Ruleset

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      - name: Install dependencies
        run: |
          pip install pyyaml


      - name: Download mihomo
        run: |
          mkdir -p bin

          wget -O bin/mihomo.gz \
          https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1-go123-v1.19.30.gz

          gzip -d bin/mihomo.gz

          chmod +x bin/mihomo


      - name: Fetch rules
        run: |
          python scripts/fetch.py


      - name: Parse rules
        run: |
          python scripts/parse.py


      - name: Merge rules
        run: |
          python scripts/merge.py


      - name: Build mrs
        run: |
          python scripts/compile.py


      - name: Commit changes
        run: |

          git config user.name \
          "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          git add rules/


          git diff --cached --quiet || \
          git commit -m "Update mihomo ruleset"


          git push
